# ============================================================
# db-testing-framework  ?  db-test.properties
# ============================================================
# Place this file on the classpath of the consuming project
# (e.g. src/test/resources/db-test.properties) and override
# these values as needed.
#
# db.dialect
#   Controls which SQL dialect H2 will emulate.
#   Accepted values (case-insensitive):
#     H2          ? H2 native (no emulation)
#     ORACLE      ? Oracle 11g compatibility
#     MSSQL       ? MS SQL Server 2022 compatibility
#     POSTGRESQL  ? PostgreSQL 14 compatibility
#
test.db.dialect=H2

# db.name
#   Logical name of the in-memory H2 database.
#   Used to scope connections; defaults to 'testdb'.
#
test.db.name=testdb